
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第27回 フォントファイル読込試験</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
}

h1 {
    font-size: 23px;
}

input, select {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    font-size: 17px;
}

.sample {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #999;
    text-align: center;
    background: #fffdf8;
}

.sample-text {
    font-family: serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1.8;
}

#status {
    margin-top: 15px;
    padding: 12px;
    background: #eef3f8;
}
</style>
</head>

<body>
<div class="container">

<h1>第27回 フォントファイル読込試験</h1>

<p>TTF・OTFなどのフォントファイルを選択してください。</p>

<input
    type="file"
    id="fontFile"
    accept=".ttf,.otf,.woff,.woff2"
>

<label for="fontWeight">文字の太さ</label>

<select id="fontWeight">
    <option value="400">標準（400）</option>
    <option value="700" selected>太字（700）</option>
    <option value="800">特太字（800）</option>
    <option value="900">極太字（900）</option>
</select>

<div class="sample">
    <div class="sample-text" id="sample">
        奉納<br>
        一金壱萬圓也<br>
        山田太郎
    </div>
</div>

<div id="status">
    フォントファイルは未選択です。
</div>

</div>

<script>
"use strict";

const fontFile = document.getElementById("fontFile");
const fontWeight = document.getElementById("fontWeight");
const sample = document.getElementById("sample");
const status = document.getElementById("status");

let loadedFont = null;

fontFile.addEventListener("change", async () => {
    const file = fontFile.files[0];
    if (!file) return;

    try {
        const data = await file.arrayBuffer();

        const font = new FontFace(
            "TMJUserFont",
            data
        );

        await font.load();

        if (loadedFont) {
            document.fonts.delete(loadedFont);
        }

        document.fonts.add(font);
        loadedFont = font;

        sample.style.fontFamily = '"TMJUserFont", serif';
        sample.style.fontWeight = fontWeight.value;

        status.textContent =
            "読み込み成功：" + file.name;

    } catch (error) {
        status.textContent =
            "読み込み失敗：" + error.message;
    }
});

fontWeight.addEventListener("change", () => {
    sample.style.fontWeight = fontWeight.value;
});
</script>
</body>
</html>
