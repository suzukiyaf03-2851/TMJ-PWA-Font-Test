
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>玉川神社 下げ札管理</title>


<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="theme-color" content="#c8e6c9">


<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #f5f5f5;
    font-family: sans-serif;
}

.container {
    max-width: 620px;
    margin: auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
}

h1 {
    font-size: 26px;
    text-align: center;
}

.version {
    text-align: center;
    color: #666;
}

label {
    display: block;
    margin-top: 15px;
    font-size: 17px;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    font-size: 19px;
}

.preview {
    margin-top: 20px;
    padding: 15px;
    background: #f0f5ef;
    text-align: center;
}

#kanjiResult {
    font-size: 24px;
    font-weight: bold;
}

#nameResult {
    margin-top: 10px;
    font-size: 20px;
}

.layout-settings {
    margin-top: 25px;
    padding: 15px;
    background: #eef3f8;
    border-radius: 8px;
}

.layout-settings h2 {
    font-size: 21px;
}

.layout-settings h3 {
    font-size: 18px;
    margin-bottom: 5px;
}

.setting-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
}

.setting-row label {
    font-size: 15px;
    margin-top: 5px;
}

.setting-row input {
    width: 100%;
    min-width: 0;
    font-size: 17px;
    padding: 7px;
}

.button-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 20px;
}

button {
    padding: 13px;
    font-size: 17px;
    border: 1px solid #999;
    border-radius: 6px;
    cursor: pointer;
    background: #dce8f5;
}

/* 第33回：ボタン押下時の視覚的フィードバック */
button {
    transition:
        background-color 0.12s ease,
        box-shadow 0.12s ease,
        transform 0.12s ease;
}

button:active {
    background-color: #8fb6dc;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.25);
    transform: translateY(2px);
}

button.primary:active {
    background-color: #82c78a;
}

button:focus-visible {
    outline: 3px solid #3569b0;
    outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
    button {
        transition: none;
    }
}

button.primary {
    background: #c8e6c9;
}

.print-button {
    width: 100%;
    margin-top: 25px;
    font-size: 20px;
}

.status {
    margin-top: 15px;
    padding: 10px;
    background: #fff3cd;
    border-radius: 5px;
    font-size: 15px;
}

.status.error {
    background: #f8d7da;
    color: #842029;
}

.preview-title {
    margin: 25px 0 12px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}

.paper-area {
    display: flex;
    justify-content: center;
    overflow: hidden;
}

.paper-frame {
    position: relative;
    width: 100%;
    max-width: 385px;
    aspect-ratio: 257 / 364;
}

.b4-paper {
    position: absolute;
    top: 0;
    left: 0;
    width: 257mm;
    height: 364mm;
    transform-origin: top left;
    background: #fffdf8;
    border: 1px solid #999;
    box-shadow: 0 3px 8px #0002;
    overflow: hidden;
}

.safe-area {
    position: absolute;
    left: 15mm;
    top: 15mm;
    width: 227mm;
    height: 334mm;
    border: 1px dashed #c3822d;
    pointer-events: none;
}

.hounou,
.vertical-amount,
.vertical-name {
    position: absolute;
    writing-mode: vertical-rl;
    white-space: nowrap;
    font-family: serif;
}

.hounou {
    top: 20mm;
    right: 20mm;
    font-size: 22.7pt;
}

.vertical-amount {
    top: 55mm;
    right: 55mm;
    font-size: 25.5pt;
    letter-spacing: 1mm;
}

.vertical-name {
    top: 150mm;
    right: 115mm;
    font-size: 31.2pt;
    letter-spacing: 1mm;
}

/* B4印刷設定 */
@page {
    size: 257mm 364mm;
    margin: 0;
}

@media print {
    html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
    }

    .container {
        width: 257mm !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .container > :not(.paper-area) {
        display: none !important;
    }

    .paper-area {
        display: block !important;
        width: 257mm !important;
        height: 363mm !important;
        overflow: hidden !important;
    }

    .paper-frame {
        width: 257mm !important;
        height: 363mm !important;
        max-width: none !important;
        aspect-ratio: auto !important;
    }

    .b4-paper {
        width: 257mm !important;
        height: 363mm !important;
        transform: none !important;
        border: none !important;
        box-shadow: none !important;
        background: white !important;
    }

    .safe-area {
        display: none !important;
    }
}

@media (max-width: 420px) {
    .setting-row {
        gap: 5px;
    }

    .setting-row input {
        padding: 5px;
        font-size: 15px;
    }

    .button-row {
        grid-template-columns: 1fr;
    }
}

.font-settings {
    padding: 15px;
    margin-bottom: 20px;
    background: #f3f7ed;
    border: 1px solid #cbdac0;
    border-radius: 8px;
}

.font-settings h2 {
    font-size: 21px;
}

.font-settings select {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    font-size: 17px;
}

.font-settings button {
    width: 100%;
}

#fontStatus {
    font-size: 15px;
}

</style>
</head>

<body>

<div class="container">

<script src="app.js"></script>

<script>
"use strict";

// 初期設定
const DEFAULT_LAYOUT = {
    hounou: {top: 20, right: 20, size: 22.7},
    amount: {top: 55, right: 55, size: 25.5},
    name: {top: 150, right: 115, size: 31.2}
};

const STORAGE_KEY = "tmj_pwa_layout_v1";
const INPUT_STORAGE_KEY = "tmj_pwa_input_v1";

const TARGETS = [
    {key: "hounou", selector: ".hounou"},
    {key: "amount", selector: ".vertical-amount"},
    {key: "name", selector: ".vertical-name"}
];

const statusElement =
    document.getElementById("status");

// 用紙を画面幅へ縮小表示
function scalePaper() {
    const frame =
        document.querySelector(".paper-frame");

    const paper =
        document.getElementById("b4Paper");

    if (!frame || !paper) return;

    const scale =
        frame.clientWidth / paper.offsetWidth;

    paper.style.transform =
        "scale(" + scale + ")";
}

// 入力欄から設定値を取得
function readLayout() {
    const result = {};

    for (const target of TARGETS) {
        const key = target.key;

        const topText =
            document.getElementById(key + "Top").value;

        const rightText =
            document.getElementById(key + "Right").value;

        const sizeText =
            document.getElementById(key + "Size").value;

        if (!topText || !rightText || !sizeText) {
            throw new Error(
                key + " の入力欄に空白があります。"
            );
        }

        const top = Number(topText);
        const right = Number(rightText);
        const size = Number(sizeText);

        if (
            !Number.isFinite(top) ||
            !Number.isFinite(right) ||
            !Number.isFinite(size) ||
            top < 0 || top > 364 ||
            right < 0 || right > 257 ||
            size < 1 || size > 180
        ) {
            throw new Error(
                key + " の設定値が範囲外です。"
            );
        }

        result[key] = {top, right, size};
    }

    return result;
}

// 設定値を入力欄へ書き込む
function writeLayout(layout) {
    for (const target of TARGETS) {
        const key = target.key;

        document.getElementById(key + "Top").value =
            layout[key].top;

        document.getElementById(key + "Right").value =
            layout[key].right;

        document.getElementById(key + "Size").value =
            layout[key].size;
    }
}

// 実際の下げ札へ適用
function applyLayout(layout) {
    for (const target of TARGETS) {
        const element =
            document.querySelector(target.selector);

        const values = layout[target.key];

        element.style.top =
            values.top + "mm";

        element.style.right =
            values.right + "mm";

        element.style.fontSize =
            values.size + "pt";
    }
}

// 状態表示
function setStatus(message, error = false) {
    statusElement.textContent = message;
    statusElement.classList.toggle(
        "error", error
    );
}

// 画面の設定を反映
function applyFromInputs() {
    try {
        const layout = readLayout();
        applyLayout(layout);
        setStatus("設定を反映しました。");
    } catch (error) {
        setStatus(error.message, true);
    }
}

// 設定を保存
function saveLayout() {
    try {
        const layout = readLayout();

        applyLayout(layout);

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(layout)
        );

        const fontSettings = readFontSettings();

        localStorage.setItem(
            "tmj_pwa_font_v1",
            JSON.stringify(fontSettings)
        ); 

        // 氏名・奉納金額を保存
        const inputData = {
            name: document.getElementById("name").value,
            amount: document.getElementById("amount").value
        };

        localStorage.setItem(
            INPUT_STORAGE_KEY,
            JSON.stringify(inputData)
        );

        setStatus("設定を保存しました。");
    } catch (error) {
        setStatus(
            "保存できませんでした：" + error.message,
            true
        );
    }
}

// 第52段階：氏名・奉納金額の消去
function clearSavedInputs() {

    const confirmed = window.confirm(
        "氏名・奉納金額を消去しますか？\n" +
        "ブラウザーに保存された入力内容も削除します。"
    );

    if (!confirmed) {
        return;
    }

    // 保存した氏名・金額を削除
    localStorage.removeItem(INPUT_STORAGE_KEY);

    // 入力欄を空白にする
    const nameInput = document.getElementById("name");
    const amountInput = document.getElementById("amount");

    nameInput.value = "";
    amountInput.value = "";

    // 既存のプレビュー更新処理を実行
    nameInput.dispatchEvent(
        new Event("input", { bubbles: true })
    );

    amountInput.dispatchEvent(
        new Event("input", { bubbles: true })
    );

    setStatus("氏名・奉納金額を消去しました。");
}

// 消去ボタンに処理を登録
document.getElementById("clearInputButton")
    .addEventListener("click", clearSavedInputs);

// 第51段階：氏名・奉納金額の自動復元
function restoreSavedInputs() {
    try {
        const text = localStorage.getItem(INPUT_STORAGE_KEY);

        if (text === null) {
            return;
        }

        const data = JSON.parse(text);

        if (
            !data ||
            typeof data.name !== "string" ||
            typeof data.amount !== "string"
        ) {
            throw new Error("保存済み入力データが不正です。");
        }

        document.getElementById("name").value = data.name;
        document.getElementById("amount").value = data.amount;

        // 入力内容の変更を既存のプレビュー処理に通知
        document.getElementById("name").dispatchEvent(
            new Event("input", { bubbles: true })
        );

        document.getElementById("amount").dispatchEvent(
            new Event("input", { bubbles: true })
        );

    } catch (error) {
        setStatus(
            "氏名・金額の自動復元失敗：" + error.message,
            true
        );
    }
}
// 第33回：保存済みレイアウトを起動時に自動復元
function restoreSavedLayout() {
    try {
        const text = localStorage.getItem(STORAGE_KEY);

        if (text === null) {
            return;
        }

        const layout = JSON.parse(text);

        for (const target of TARGETS) {
            const value = layout[target.key];

            if (
                !value ||
                !Number.isFinite(value.top) ||
                !Number.isFinite(value.right) ||
                !Number.isFinite(value.size) ||
                value.top < 0 || value.top > 364 ||
                value.right < 0 || value.right > 257 ||
                value.size < 1 || value.size > 180
            ) {
                throw new Error("保存済みレイアウトが不正です。");
            }
        }

        writeLayout(layout);
        applyLayout(layout);

    } catch (error) {
        setStatus(
            "レイアウト自動復元失敗：" + error.message,
            true
        );
    }
}

function loadLayout() {
    try {
        const text =
            localStorage.getItem(STORAGE_KEY);

        if (text === null) {
            setStatus(
                "保存された設定がありません。",
                true
            );
            return;
        }

        const layout = JSON.parse(text);

        writeLayout(layout);
        applyFromInputs();
    const savedFont = localStorage.getItem("tmj_pwa_font_v1");

    if (savedFont !== null) {
        const fontSettings = JSON.parse(savedFont);

        const fontSelect = document.getElementById("commonFont");
        const weightSelect = document.getElementById("commonWeight");

        const fontName = fontSettings.font;
        const fontWeight = String(fontSettings.weight);

        if (fontName && !Array.from(fontSelect.options)
            .some(option => option.value === fontName)) {
            fontSelect.add(new Option(fontName, fontName));
        }

        fontSelect.value = fontName || "serif";

        if (["400", "700", "800", "900"].includes(fontWeight)) {
            weightSelect.value = fontWeight;
        } else {
            weightSelect.value = "700";
        }

        applyFontSettings();
    }
        setStatus("保存設定を読み込みました。");
    } catch (error) {
        setStatus(
            "読み込みできませんでした：" +
            error.message,
            true
        );
    }
}

// 初期値に戻す
function resetLayout() {
    writeLayout(DEFAULT_LAYOUT);
    applyLayout(DEFAULT_LAYOUT);

    setStatus("初期値に戻しました。");
}

// ボタンの登録
document.getElementById("applyButton")
    .addEventListener("click", applyFromInputs);

document.getElementById("saveButton")
    .addEventListener("click", saveLayout);

document.getElementById("loadButton")
    .addEventListener("click", loadLayout);

document.getElementById("resetButton")
    .addEventListener("click", resetLayout);

// 起動時の処理
writeLayout(DEFAULT_LAYOUT);
applyLayout(DEFAULT_LAYOUT);

// 印刷後の縮小表示復元
window.addEventListener("afterprint", () => {
    requestAnimationFrame(scalePaper);
});

window.addEventListener("load", scalePaper);
window.addEventListener("load", restoreSavedLayout);
window.addEventListener("load", restoreSavedInputs);
window.addEventListener("load", restoreTMJFont);
window.addEventListener("resize", scalePaper);


    // =====================================
    // 第8回：JSON書き出し・読込み
    // =====================================

    // JSONファイルに書き出す
    function exportLayoutJSON() {
        try {
            const layout = readLayout();

            // 入力値を先に画面へ反映
            applyLayout(layout);

            const data = {
                format: "TMJ_PWA_LAYOUT",
                version: 1,
                paper: "B4",
                unit_position: "mm",
                unit_font: "pt",
                layout: layout,
                font_settings: readFontSettings()
            };

            const json = JSON.stringify(data, null, 2);

            const blob = new Blob(
                [json],
                {type: "application/json;charset=utf-8"}
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "TMJ_PWA_Layout_Ver1.json";

            document.body.appendChild(link);
            link.click();
            link.remove();

            // ダウンロード開始後にURLを解放
            setTimeout(() => {
                URL.revokeObjectURL(url);
            }, 10000);

            setStatus("JSONファイルを書き出しました。");

        } catch (error) {
            setStatus(
                "書き出し失敗：" + error.message,
                true
            );
        }
    }

    // JSONファイルの内容を検証
    function validateImportedLayout(data) {
        if (
            !data ||
            data.format !== "TMJ_PWA_LAYOUT" ||
            data.version !== 1 ||
            data.paper !== "B4" ||
            data.unit_position !== "mm" ||
            data.unit_font !== "pt" ||
            !data.layout
        ) {
            throw new Error(
                "対応していない設定ファイルです。"
            );
        }

        for (const target of TARGETS) {
            const value = data.layout[target.key];

            if (
                !value ||
                typeof value.top !== "number" ||
                typeof value.right !== "number" ||
                typeof value.size !== "number" ||
                !Number.isFinite(value.top) ||
                !Number.isFinite(value.right) ||
                !Number.isFinite(value.size) ||

function readFontSettings() {

        document.getElementById("commonFont").selectedOptions[0];

        : "";

        savedFont = "font:" + selectedText.slice(prefix.length);
    } else if (selectedText.startsWith("読み込んだフォント：")) {
        savedFont = "font:" +
            selectedText.slice("読み込んだフォント：".length);
    } else {
        savedFont = tmjLoadedFontKey || "TMJ_SAVED_FONT";
    }
}

    return {
        font: savedFont,
        weight: Number(
            document.getElementById("commonWeight").value
        )
    };
}

function applyFontSettings() {
        const select = document.getElementById("commonFont");

    if (select.value === "TMJ_SAVED_FONT") {
        if (!tmjLoadedFont) {
            document.getElementById("fontFileStatus").textContent =
                "保存済みフォントを復元できません。";

    const font = select.value;
    const weight = document.getElementById("commonWeight").value;

        ".vertical-amount",
        ".vertical-name"
    ];

    for (const selector of selectors) {

// 第33回：フォント保存用IndexedDB
const TMJ_FONT_DB_NAME = "TMJ_PWA_FontDB";
const TMJ_FONT_STORE_NAME = "fonts";

function openTMJFontDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(TMJ_FONT_DB_NAME, 1);

        request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(TMJ_FONT_STORE_NAME)) {
                db.createObjectStore(TMJ_FONT_STORE_NAME);
            }
        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

// 第33回：フォントファイルをIndexedDBに保存
async function saveTMJFontFile(file) {
    const db = await openTMJFontDB();

    try {
        return await new Promise((resolve, reject) => {
            const transaction =
                db.transaction(TMJ_FONT_STORE_NAME, "readwrite");

            const store =
                transaction.objectStore(TMJ_FONT_STORE_NAME);

            store.put({
                name: file.name,
                data: file
            }, "selectedFont");

            transaction.oncomplete = () => resolve();

            transaction.onerror = () =>
                reject(transaction.error);

            transaction.onabort = () =>
                reject(transaction.error);
        });
    } finally {
        db.close();
    }
}

// 第33回：IndexedDBから保存済みフォントを読み出す
async function loadTMJFontFile() {
    const db = await openTMJFontDB();

    try {
        return await new Promise((resolve, reject) => {
            const transaction =
                db.transaction(TMJ_FONT_STORE_NAME, "readonly");

            const store =
                transaction.objectStore(TMJ_FONT_STORE_NAME);

            const request = store.get("selectedFont");

            request.onsuccess = () => {
                resolve(request.result || null);
            };

            request.onerror = () => {
                reject(request.error);
            };

            transaction.onabort = () => {
                reject(transaction.error);
            };
        });
    } finally {
        db.close();
    }
}

// 第33回：保存済みフォントの自動復元
async function restoreTMJFont() {
    const status = document.getElementById("fontFileStatus");

    try {
        const saved = await loadTMJFontFile();

        if (!saved || !saved.data) {
            return;
        }

        const data = await saved.data.arrayBuffer();

        const font = new FontFace(
            "TMJImportedFont_" + (++tmjFontSequence),
            data,
            { weight: "100 900" }
        );

        await font.load();
        document.fonts.add(font);

        const fontName = font.family;
        const select = document.getElementById("commonFont");

        select.add(
            new Option(
                "保存済みフォント：" + saved.name,
                fontName
            )
        );

        select.value = fontName;
        applyFontSettings();

        tmjLoadedFont = font;
        tmjLoadedFontKey = "font:" + saved.name;
        tmjFontRegistry.set(tmjLoadedFontKey, font);

        status.textContent =
            "保存済みフォントを復元しました：" + saved.name;

    } catch (error) {
        status.textContent =
            "フォントの自動復元に失敗：" + error.message;
    }
}

// 第33回：複数フォントを個別保存する
async function saveTMJFontToLibrary(file) {
    const db = await openTMJFontDB();
    const key = "font:" + file.name;

    try {
        await new Promise((resolve, reject) => {
            const transaction =
                db.transaction(TMJ_FONT_STORE_NAME, "readwrite");

            const store =
                transaction.objectStore(TMJ_FONT_STORE_NAME);

            store.put({
                name: file.name,
                data: file
            }, key);

            transaction.oncomplete = () => resolve();

            transaction.onerror = () =>
                reject(transaction.error);

            transaction.onabort = () =>
                reject(transaction.error);
        });

        return key;

    } finally {
        db.close();
    }
}

// 第33回：複数フォントから指定したファイルを読み出す
async function loadTMJFontFromLibrary(fontKey) {
    if (typeof fontKey !== "string" ||
        !fontKey.startsWith("font:") ||
        fontKey.length <= 5) {
        throw new Error("フォントの識別子が不正です。");
    }

    const db = await openTMJFontDB();

    try {
        return await new Promise((resolve, reject) => {
            const transaction =
                db.transaction(TMJ_FONT_STORE_NAME, "readonly");

            const store =
                transaction.objectStore(TMJ_FONT_STORE_NAME);

            const request = store.get(fontKey);

            request.onsuccess = () => {
                resolve(request.result || null);
            };

            request.onerror = () => {
                reject(request.error);
            };

            transaction.onabort = () => {
                reject(transaction.error);
            };
        });
    } finally {
        db.close();
    }
}

// 第33回：指定した保存済みフォントを復元する
async function applyTMJFontFromLibrary(fontKey) {

        // 第42段階：登録済みフォントを再利用する
        if (tmjFontRegistry.has(fontKey)) {
            const font = tmjFontRegistry.get(fontKey);

            const existingOption = Array.from(select.options).find(
                option => option.value === font.family
            );

            if (!existingOption) {
                select.add(new Option(
                    "保存済みフォント：" + fontKey.slice(5),
                    font.family
                ));
            }

        select.value = font.family;

        tmjLoadedFont = font;
        tmjLoadedFontKey = fontKey;

        applyFontSettings();

        document.getElementById("fontFileStatus").textContent =
            "登録済みフォントを再利用しました：" + fontKey.slice(5);

        return;
    }
    
    const saved = await loadTMJFontFromLibrary(fontKey);

    if (!saved || !saved.data) {
        throw new Error(
            "指定されたフォントが端末内に保存されていません。"
        );
    }

    const data = await saved.data.arrayBuffer();

    const font = new FontFace(
        "TMJImportedFont_" + (++tmjFontSequence),
        data,
        { weight: "100 900" }
    );

    await font.load();
    document.fonts.add(font);

    const select = document.getElementById("commonFont");
    const fontName = font.family;

    if (!Array.from(select.options).some(
    option => option.value === fontName
)) {
    select.add(
        new Option(
            "保存済みフォント：" + saved.name,
            fontName
        )
    );
}

    select.value = fontName;
    applyFontSettings();

    tmjLoadedFont = font;
    tmjLoadedFontKey = fontKey;
    tmjFontRegistry.set(fontKey, font);

    document.getElementById("fontFileStatus").textContent =

}

            }

            const font = new FontFace(
                "TMJImportedFont_" + (++tmjFontSequence),

                );
            }

            select.value = fontName;
            applyFontSettings();

            status.textContent =
